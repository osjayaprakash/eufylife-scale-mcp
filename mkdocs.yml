site_name: eufylife-scale-mcp
site_description: MCP server exposing EufyLife smart scale weight and body composition
repo_url: https://github.com/osjayaprakash/eufylife-scale-mcp
docs_dir: documentation

theme:
  name: material
  features:
    - content.code.copy

nav:
  - Home: index.md
  - Installation: install.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
