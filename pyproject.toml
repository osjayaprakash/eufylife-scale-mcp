[project]
name = "eufylife-scale-mcp"
version = "0.1.0"
description = "MCP server exposing EufyLife smart scale weight and body composition"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "eufy", "eufylife", "smart-scale", "weight", "body-composition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "httpx2>=2.5,<3",
    "mcp>=2.2,<3",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/osjayaprakash/eufylife-scale-mcp"
Documentation = "https://eufylife-scale-mcp.readthedocs.io"
Issues = "https://github.com/osjayaprakash/eufylife-scale-mcp/issues"

[project.optional-dependencies]
langfuse = ["langfuse>=4,<5"]

[project.scripts]
eufylife-scale-mcp = "eufylife_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "INSTALL.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/eufylife_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real EufyLife API (needs EUFYLIFE_EMAIL/PASSWORD)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
